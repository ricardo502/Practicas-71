<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de combustible</title>
</head>
<body>

  <div style="background-color: honeydew; max-width: 450px; padding: 20px; font-family: Arial;">
    <h1>⛽ Calcular combustible</h1>

    <p>Calcula cuántos litros vas a necesitar</p>

    <label for="kilometros">Kilómetros:</label>
    <input type="number" id="kilometros" min="0" step="any">

    <br>
    <br>

    <button onclick="calcularCombustible()" style="background-color: cadetblue; color: white; border: none; padding: 5px; font-size: 20px;">
      Calcular combustible
    </button>

    <p id="resultado"></p>
  </div>

  <script>
    function calcularCombustible() {
      var kilometros = document.getElementById("kilometros").value;

      if (kilometros === "" || Number(kilometros) < 0) {
        document.getElementById("resultado").textContent = "Ingresa una cantidad válida de kilómetros.";
        return;
      }

      // El vehículo recorre 10 kilómetros con un litro.
      var litros = kilometros / 10;

      document.getElementById("resultado").textContent = "Carga " + litros + " litros de combustible";
    }
  </script>

</body>
</html>
