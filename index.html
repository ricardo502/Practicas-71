<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temas con HTML y CSS</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <main class="contenedor">
        <h1>Selector de temas</h1>
        <p class="introduccion">Elige un tema para cambiar el estilo de la tarjeta.</p>

        <input type="radio" name="tema" id="claro" checked>
        <input type="radio" name="tema" id="oscuro">
        <input type="radio" name="tema" id="personalizado">

        <section class="tarjeta">
            <div class="opciones">
                <label for="claro">Claro</label>
                <label for="oscuro">Oscuro</label>
                <label for="personalizado">Personalizado</label>
            </div>
            <h2>Hola, mundo</h2>
            <p>Esta es una tarjeta sencilla que cambia de tema usando solamente CSS.</p>
            <button>Boton principal</button>
        </section>
    </main>
</body>
</html>
